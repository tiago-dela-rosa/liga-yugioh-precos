# Ao criar uma tag vX.Y.Z, gera o .zip da extensão e publica uma Release com ele.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# A versão da tag precisa bater com a do manifest.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confere versão do manifest x tag
        run: |
          MANIFEST=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "manifest.json está em $MANIFEST mas a tag é $TAG" >&2
            exit 1
          fi

      - name: Gera o zip
        run: python3 scripts/build-zip.py

      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Baixe o .zip abaixo, extraia e siga o [guia de instalação](https://github.com/${GITHUB_REPOSITORY}#instalação)."
